version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22   # Node.js 22 を使う
        - npm ci       # ライブラリをインストール
    build:
      commands:
        - npm run build   # Next.js をビルド（結果は .next フォルダに出る）
  artifacts:
    baseDirectory: .next  # Next.js の出力先（Vite の dist とはここが違う）
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*   # Next.js のビルドキャッシュ
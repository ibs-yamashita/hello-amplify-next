# amplify.yml：Next.js 用のシンプルな設定
# Next.js の SSR（サーバー機能）を Amplify に自動認識させる
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # .next ではなく、リポジトリのルート（プロジェクト直下）を指定する
    # Amplify が Next.js の SSR 構成を自動的に読み取ってくれる
    baseDirectory: .
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
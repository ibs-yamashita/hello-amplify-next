# amplify.yml：Next.js（SSR）用の正しい設定
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next   # ← Next.js SSRアプリは必ずこれにする（公式ドキュメントで確認済み）
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*